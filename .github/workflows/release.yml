name: Release Astralis (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test -- --nocapture

      - name: Build release binary
        run: cargo build --release

      - name: Package release zip
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\Astralis.exe dist\Astralis.exe
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Compress-Archive -Path dist\Astralis.exe, dist\README.md, dist\LICENSE -DestinationPath "Astralis-$tag-win64.zip" -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/Astralis.exe
            Astralis-*-win64.zip
          generate_release_notes: true
